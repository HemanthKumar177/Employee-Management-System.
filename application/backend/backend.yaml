apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rigel

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
        metadata:
          labels:
            app: backend
        spec:
          containers:
            - name: backend 
              image:   725128686347.dkr.ecr.us-west-1.amazonaws.com/rigel-ems-app:backend-latest
              imagePullPolicy: Always
              ports: 
              - containerPort: 8080   
---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rigel

spec:
  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

  type: ClusterIP  

     