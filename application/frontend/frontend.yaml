apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rigel

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
        metadata:
          labels:
            app: frontend
        spec:
          containers:
            - name: frontend
              image:   725128686347.dkr.ecr.us-west-1.amazonaws.com/rigel-ems-app:frontend-latest
              imagePullPolicy: Always
              ports: 
              - containerPort: 80
---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rigel
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
     