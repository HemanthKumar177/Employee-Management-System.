name: Build and Push Docker Images to Amazon ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-1

  APP_ECR_REPOSITORY: rigel-ems-app
  JENKINS_ECR_REPOSITORY: rigel-jenkins

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::725128686347:role/github-actions-codeartifact-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      
      # Backend
      

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_ECR_REPOSITORY }}:backend-latest \
            ./application/backend

      - name: Push Backend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_ECR_REPOSITORY }}:backend-latest

      
      # Frontend
      

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_ECR_REPOSITORY }}:frontend-latest \
            ./application/frontend

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_ECR_REPOSITORY }}:frontend-latest

      
      # Jenkins
      

      - name: Build Jenkins Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.JENKINS_ECR_REPOSITORY }}:jenkins-latest \
            ./jenkins

      - name: Push Jenkins Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.JENKINS_ECR_REPOSITORY }}:jenkins-latest