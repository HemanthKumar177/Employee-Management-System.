apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
data:
  mysql-root-password: {{ .Values.auth.rootPassword | b64enc }}
  mysql-user: {{ .Values.auth.username | b64enc }}
  mysql-password: {{ .Values.auth.password | b64enc }}
  mysql-database: {{ .Values.auth.database | b64enc }}  
