controller:
  image:
    repository: "jenkins/jenkins"
    tag: "lts"

  admin:
    username: admin
    password: admin123

  serviceType: ClusterIP

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  ingress:
    enabled: true
    ingressClassName: alb
    hostName: jenkinsrig.training.azuga.com

    annotations:
      alb.ingress.kubernetes.io/group.name: rigel
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-1:725128686347:certificate/5a4a1344-e3eb-43b6-8299-c5200e3f3931
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-path: /login
      external-dns.alpha.kubernetes.io/hostname: jenkinsrig.training.azuga.com

persistence:
  enabled: true
  storageClass: gp3
  size: 2Gi

serviceAccount:
  create: true

rbac:
  create: true

agent:
  enabled: true
