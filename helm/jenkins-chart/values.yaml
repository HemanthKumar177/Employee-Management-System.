replicaCount: 1

image:
  repository: 725128686347.dkr.ecr.us-west-1.amazonaws.com/rigel-jenkins
  tag: jenkins-latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  agentPort: 50000

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

persistence:
  accessMode: ReadWriteOnce
  storageClass: gp3
  size: 4Gi