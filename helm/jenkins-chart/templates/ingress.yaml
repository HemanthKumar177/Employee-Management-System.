apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/group.name: rigel
    alb.ingress.kubernetes.io/scheme: internal   # Change to internet-facing if you want public access
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-1:725128686347:certificate/5a4a1344-e3eb-43b6-8299-c5200e3f3931
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /login
    external-dns.alpha.kubernetes.io/hostname: jenkinsrig.training.azuga.com

spec:
  ingressClassName: alb
  rules:
    - host: jenkinsrig.training.azuga.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 8080